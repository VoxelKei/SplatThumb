name: fuzz-weekly

# Longer fuzzing run once a week (and on demand). The per-change run in build.yml is only
# 60 seconds per fuzzer.
on:
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz (20 min each)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: |
          cmake --preset linux-clang-fuzz
          cmake --build --preset linux-clang-fuzz

      - name: Fuzz
        run: .github/scripts/run-fuzz.sh 1200

      - name: Upload crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash
          path: |
            fuzz-out/crash-*
            fuzz-out/timeout-*
            fuzz-out/oom-*
          if-no-files-found: ignore
