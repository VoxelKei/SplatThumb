name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: windows (${{ matrix.preset }})
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: msvc-debug
            config: Debug
            build_dir: build/msvc
          - preset: msvc-release
            config: Release
            build_dir: build/msvc
          - preset: msvc-asan
            config: Debug
            build_dir: build/msvc-asan
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Add MSVC tools to PATH
        shell: pwsh
        run: .github/scripts/Add-MsvcToolsToPath.ps1

      - name: Configure, build, test
        run: cmake --workflow --preset ${{ matrix.preset }}

      - name: Check shell extension exports
        shell: pwsh
        run: .github/scripts/Test-ShellextExports.ps1 -Path ${{ matrix.build_dir }}/bin/${{ matrix.config }}/splatthumb_shellext.dll

      - name: Check development registration scripts (PowerShell 7)
        shell: pwsh
        run: .github/scripts/Test-DevRegistration.ps1 -DllPath ${{ matrix.build_dir }}/bin/${{ matrix.config }}/splatthumb_shellext.dll

      - name: Check development registration scripts (Windows PowerShell 5.1)
        shell: powershell
        run: .github/scripts/Test-DevRegistration.ps1 -DllPath ${{ matrix.build_dir }}/bin/${{ matrix.config }}/splatthumb_shellext.dll

      # The installer is built and tested from the Release build only.
      - name: Build MSI
        if: matrix.preset == 'msvc-release'
        shell: pwsh
        run: |
          cmake --build --preset msvc-release --target msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msi = Get-Item build/msvc/msi/Release/SplatThumb-*-x64.msi
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$($msi.FullName).sha256" -Value "$hash  $($msi.Name)" -NoNewline
          Write-Host "$hash  $($msi.Name)"
          "MSI_PATH=$($msi.FullName)" >> $env:GITHUB_ENV

      - name: Test MSI install, upgrade and uninstall
        if: matrix.preset == 'msvc-release'
        shell: pwsh
        run: .github/scripts/Test-Msi.ps1 -MsiPath $env:MSI_PATH -DllPath build/msvc/bin/Release/splatthumb_shellext.dll -LogDir msi-logs

      - name: Upload MSI
        if: matrix.preset == 'msvc-release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: msi
          path: |
            build/msvc/msi/Release/SplatThumb-*-x64.msi
            build/msvc/msi/Release/SplatThumb-*-x64.msi.sha256
          if-no-files-found: error

      - name: Upload MSI logs
        if: failure() && matrix.preset == 'msvc-release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: msi-logs
          path: msi-logs
          if-no-files-found: ignore

  linux-core:
    # Builds core without Windows headers, which keeps it portable and lets us
    # run UBSan, which MSVC does not provide.
    name: linux core (clang ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Configure, build, test
        run: cmake --workflow --preset linux-clang-sanitize

  fuzz:
    # Short fuzzing run on every change to catch parser crashes early.
    name: fuzz header parser (60 s)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Build
        run: |
          cmake --preset linux-clang-fuzz
          cmake --build --preset linux-clang-fuzz

      - name: Fuzz
        run: |
          mkdir -p fuzz-out/corpus
          ./build/linux-clang-fuzz/bin/fuzz_header \
            -dict=fuzz/ply.dict -max_len=70000 -max_total_time=60 \
            -artifact_prefix=fuzz-out/ fuzz-out/corpus fuzz/corpus

      - name: Upload crashing input
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crash
          path: fuzz-out/crash-*
          if-no-files-found: ignore
