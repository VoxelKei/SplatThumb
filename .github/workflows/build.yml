name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: windows (${{ matrix.preset }})
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: msvc-debug
            config: Debug
            build_dir: build/msvc
          - preset: msvc-release
            config: Release
            build_dir: build/msvc
          - preset: msvc-asan
            config: Debug
            build_dir: build/msvc-asan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Add MSVC tools to PATH
        shell: pwsh
        run: .github/scripts/Add-MsvcToolsToPath.ps1

      - name: Configure, build, test
        run: cmake --workflow --preset ${{ matrix.preset }}

      - name: Check shell extension exports
        shell: pwsh
        run: .github/scripts/Test-ShellextExports.ps1 -Path ${{ matrix.build_dir }}/bin/${{ matrix.config }}/splatthumb_shellext.dll

      - name: Check development registration scripts (PowerShell 7)
        shell: pwsh
        run: .github/scripts/Test-DevRegistration.ps1 -DllPath ${{ matrix.build_dir }}/bin/${{ matrix.config }}/splatthumb_shellext.dll

      - name: Check development registration scripts (Windows PowerShell 5.1)
        shell: powershell
        run: .github/scripts/Test-DevRegistration.ps1 -DllPath ${{ matrix.build_dir }}/bin/${{ matrix.config }}/splatthumb_shellext.dll

      # The installer is built and tested from the Release build only.
      - name: Build MSI
        if: matrix.preset == 'msvc-release'
        shell: pwsh
        run: |
          cmake --build --preset msvc-release --target msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msi = Get-Item build/msvc/msi/Release/SplatThumb-*-x64.msi
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$($msi.FullName).sha256" -Value "$hash  $($msi.Name)" -NoNewline
          Write-Host "$hash  $($msi.Name)"
          "MSI_PATH=$($msi.FullName)" >> $env:GITHUB_ENV

      # The last published release, to test upgrading from it. Checked against the
      # SHA256SUMS.txt published with it.
      - name: Download the previous release
        if: matrix.preset == 'msvc-release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: v0.3.0
        run: |
          gh release download $env:PREVIOUS_TAG --repo $env:GITHUB_REPOSITORY --dir previous --pattern '*.msi' --pattern 'SHA256SUMS.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msi = Get-Item previous/SplatThumb-*-x64.msi
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = (Get-Content previous/SHA256SUMS.txt | Where-Object { $_ -like "*$($msi.Name)" }) -split '\s+' | Select-Object -First 1
          if ($hash -ne $expected) { throw "SHA-256 of $($msi.Name) is $hash, expected $expected" }
          "PREVIOUS_MSI_PATH=$($msi.FullName)" >> $env:GITHUB_ENV

      - name: Test MSI install, upgrade and uninstall
        if: matrix.preset == 'msvc-release'
        shell: pwsh
        run: .github/scripts/Test-Msi.ps1 -MsiPath $env:MSI_PATH -DllPath build/msvc/bin/Release/splatthumb_shellext.dll -LogDir msi-logs -PreviousMsiPath $env:PREVIOUS_MSI_PATH

      - name: Upload MSI
        if: matrix.preset == 'msvc-release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi
          path: |
            build/msvc/msi/Release/SplatThumb-*-x64.msi
            build/msvc/msi/Release/SplatThumb-*-x64.msi.sha256
          if-no-files-found: error

      - name: Upload MSI logs
        if: failure() && matrix.preset == 'msvc-release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-logs
          path: msi-logs
          if-no-files-found: ignore

  linux-core:
    # Builds core without Windows headers, which keeps it portable and lets us
    # run UBSan, which MSVC does not provide.
    name: linux core (clang ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure, build, test
        run: cmake --workflow --preset linux-clang-sanitize

  fuzz:
    # Short fuzzing run on every change to catch parser and renderer crashes early.
    # fuzz-weekly.yml runs the same fuzzers for longer.
    name: fuzz (60 s each)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: |
          cmake --preset linux-clang-fuzz
          cmake --build --preset linux-clang-fuzz

      - name: Fuzz
        run: .github/scripts/run-fuzz.sh 60

      - name: Upload crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash
          path: |
            fuzz-out/crash-*
            fuzz-out/timeout-*
            fuzz-out/oom-*
          if-no-files-found: ignore
